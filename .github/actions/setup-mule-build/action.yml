name: Set up Mule build toolchain
description: >
  Installs Temurin Java and a pinned Apache Maven release (verified with SHA-512).
  The runner image's bundled Maven is not used, because the Mule Maven Plugin resolves
  dependencies with the Maven resolver API it expects from a specific Maven release.

inputs:
  java_version:
    description: Temurin Java major version
    required: false
    default: "17"
  maven_version:
    description: Apache Maven version to install
    required: false
    default: "3.9.16"
  maven_sha512:
    description: SHA-512 of the Maven binary distribution (apache-maven-<version>-bin.tar.gz)
    required: false
    default: "831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6"

runs:
  using: composite
  steps:
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ inputs.java_version }}

    - name: Install Maven ${{ inputs.maven_version }}
      shell: bash
      env:
        MAVEN_VERSION: ${{ inputs.maven_version }}
        MAVEN_SHA512: ${{ inputs.maven_sha512 }}
      run: |
        set -euo pipefail
        install_dir="${RUNNER_TEMP}/maven"
        archive="${RUNNER_TEMP}/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
        mkdir -p "$install_dir"
        curl --silent --show-error --fail --location \
          --output "$archive" \
          "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
        echo "${MAVEN_SHA512}  ${archive}" | sha512sum --check --status || {
          echo "::error::Maven ${MAVEN_VERSION} archive failed SHA-512 verification" >&2
          exit 1
        }
        tar -xzf "$archive" -C "$install_dir"
        echo "${install_dir}/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"

    - name: Show toolchain versions
      shell: bash
      run: |
        java -version
        mvn -version
