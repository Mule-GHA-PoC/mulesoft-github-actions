name: Setup
description: Check out the application and install Java 17 plus the Maven release the Mule Maven Plugin needs.

inputs:
  fetch-depth:
    description: Git history to fetch (0 = all, needed to merge branches)
    default: '1'

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: ${{ inputs.fetch-depth }}

    # server-id must match the repository ids in the POM; credentials come from the calling job's env.
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: maven
        server-id: anypoint-exchange-v3
        server-username: ANYPOINT_USERNAME
        server-password: ANYPOINT_PASSWORD

    # The runner's bundled Maven breaks the Mule Maven Plugin, so a fixed release is installed.
    - name: Install Maven 3.9.16
      shell: bash
      run: |
        curl -fsSL -o "$RUNNER_TEMP/maven.tgz" https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz
        echo "831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6  $RUNNER_TEMP/maven.tgz" | sha512sum --check --status
        tar -xzf "$RUNNER_TEMP/maven.tgz" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"
