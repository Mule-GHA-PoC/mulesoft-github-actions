name: Mule CD (manual promotion)

# Manual promotion of one already-published Mule application version to a higher environment.
#
# - workflow_dispatch only. There is no push, schedule or pull_request trigger.
# - Deploys the exact Exchange artifact; it never compiles or repackages the application.
# - Only the allowlisted environments below are accepted (Sandbox auto-deploy lives in CI).
# - Dev versions (X.Y.Z-dev.N) are refused for every higher environment.
# - The JAR SHA-256 must be supplied from the CI run that produced the release (build-metadata.json
#   and the publish step summary); the workflow refuses to deploy anything that does not match.
# - Each target is a GitHub Environment in THIS repository (qa, uat, prod). Configure required
#   reviewers on those environments so every deployment waits for approval.

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: Mule application artifactId (Exchange asset name)
        required: true
        type: string
      version:
        description: Exact published release version, for example 1.0.0
        required: true
        type: string
      target_environment:
        description: Higher environment to deploy to
        required: true
        type: choice
        options:
          - qa
          - uat
          - prod
      expected_sha256:
        description: SHA-256 of the Exchange JAR, from the CI publish step summary
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mule-cd-${{ inputs.target_environment }}-${{ inputs.artifact_id }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate promotion request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ARTIFACT_ID: ${{ inputs.artifact_id }}
      VERSION: ${{ inputs.version }}
      TARGET: ${{ inputs.target_environment }}
      EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          errors=0
          fail() { echo "::error::$1" >&2; errors=$((errors + 1)); }

          if [[ ! "$ARTIFACT_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            fail "artifact_id must be letters, digits, '.', '_' or '-'"
          fi
          if [[ "$VERSION" =~ -dev\.|SNAPSHOT ]]; then
            fail "Snapshot and dev versions cannot be promoted to ${TARGET}; deploy an immutable release version"
          elif [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            fail "version must be an immutable release X.Y.Z, found '${VERSION}'"
          fi
          case "$TARGET" in
            qa | uat | prod) ;;
            *) fail "target_environment '${TARGET}' is not in the allowlist" ;;
          esac
          if [[ ! "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            fail "expected_sha256 must be 64 lowercase hex characters"
          fi

          if (( errors > 0 )); then
            exit 1
          fi
          echo "Promotion request accepted: ${ARTIFACT_ID}:${VERSION} -> ${TARGET}"

  deploy:
    name: Promote ${{ inputs.artifact_id }}:${{ inputs.version }} to ${{ inputs.target_environment }}
    needs: validate
    uses: ./.github/workflows/reusable-mule-deploy.yml
    with:
      environment: ${{ inputs.target_environment }}
      artifact_id: ${{ inputs.artifact_id }}
      version: ${{ inputs.version }}
      expected_sha256: ${{ inputs.expected_sha256 }}
    secrets: inherit
