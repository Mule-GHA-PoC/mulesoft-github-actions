name: Mule pipeline

# One reusable workflow for every trigger. Each stage is a job; the caller's event decides which
# stages run and the rest are shown as skipped, like skipped stages in Jenkins:
#
#                      Unit test  Package  Publish  Deploy Sandbox  Release
#   pull request          yes       yes
#   merge to develop      yes       yes      yes        yes
#   merge to main         yes                                          yes
#   manual run (CD)       deploys a published version to the chosen environment only
#
# Versions: the POM holds X.Y.Z-SNAPSHOT. develop publishes and deploys that snapshot. A merge to
# main runs maven-release-plugin prepare + perform: it publishes X.Y.Z to Exchange, tags vX.Y.Z,
# pushes the next X.Y.(Z+1)-SNAPSHOT to main and merges main back into develop.
#
# Config (org or repo level): variables ANYPOINT_ORG_ID, ANYPOINT_ENVIRONMENT,
# ANYPOINT_DEPLOYMENT_TARGET, MULE_RUNTIME_VERSION and secrets ANYPOINT_USERNAME, ANYPOINT_PASSWORD.
# Optional variables: ANYPOINT_BASE_URI, MULE_APPLICATION_NAME, MULE_RELEASE_CHANNEL,
# MULE_JAVA_VERSION, MULE_VCORES, MULE_REPLICAS. Per-environment values go in GitHub Environments.

on:
  workflow_call:
    inputs:
      artifact_id:
        description: CD only - Mule application artifactId
        type: string
        default: ''
      version:
        description: CD only - published Exchange version to deploy
        type: string
        default: ''
      environment:
        description: CD only - GitHub Environment to deploy to
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test:
    name: Unit test
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup
        uses: Mule-GHA-PoC/mulesoft-github-actions/.github/actions/setup@main
      - name: Unit test
        run: mvn -B -ntp test

  package:
    name: Package
    needs: test
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.project.outputs.artifact_id }}
      version: ${{ steps.project.outputs.version }}
    steps:
      - name: Setup
        uses: Mule-GHA-PoC/mulesoft-github-actions/.github/actions/setup@main
      - name: Package
        run: mvn -B -ntp package -DskipTests
      - name: Read project coordinates
        id: project
        run: |
          echo "version=$(mvn -q -ntp help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$(mvn -q -ntp help:evaluate -Dexpression=project.artifactId -DforceStdout)" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to Exchange
    needs: package
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    env:
      ANYPOINT_USERNAME: ${{ secrets.ANYPOINT_USERNAME }}
      ANYPOINT_PASSWORD: ${{ secrets.ANYPOINT_PASSWORD }}
    steps:
      - name: Setup
        uses: Mule-GHA-PoC/mulesoft-github-actions/.github/actions/setup@main
      - name: Publish to Exchange
        run: mvn -B -ntp deploy -DskipTests

  deploy:
    name: Deploy ${{ inputs.environment || 'Sandbox' }}
    needs: [package, publish]
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.publish.result == 'success') }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'Sandbox' }}
    concurrency:
      group: mule-deploy-${{ github.repository }}-${{ inputs.environment || 'Sandbox' }}
      cancel-in-progress: false
    env:
      ANYPOINT_BASE_URI: ${{ vars.ANYPOINT_BASE_URI }}
      ANYPOINT_ORG_ID: ${{ vars.ANYPOINT_ORG_ID }}
      ANYPOINT_ENVIRONMENT: ${{ vars.ANYPOINT_ENVIRONMENT }}
      ANYPOINT_DEPLOYMENT_TARGET: ${{ vars.ANYPOINT_DEPLOYMENT_TARGET }}
      MULE_RUNTIME_VERSION: ${{ vars.MULE_RUNTIME_VERSION }}
      MULE_RELEASE_CHANNEL: ${{ vars.MULE_RELEASE_CHANNEL }}
      MULE_JAVA_VERSION: ${{ vars.MULE_JAVA_VERSION }}
      MULE_VCORES: ${{ vars.MULE_VCORES }}
      MULE_REPLICAS: ${{ vars.MULE_REPLICAS }}
      MULE_APPLICATION_NAME: ${{ vars.MULE_APPLICATION_NAME }}
      ANYPOINT_USERNAME: ${{ secrets.ANYPOINT_USERNAME }}
      ANYPOINT_PASSWORD: ${{ secrets.ANYPOINT_PASSWORD }}
      ARTIFACT_ID: ${{ inputs.artifact_id || needs.package.outputs.artifact_id }}
      VERSION: ${{ inputs.version || needs.package.outputs.version }}
    steps:
      - name: Check out deploy script
        uses: actions/checkout@v4
        with:
          repository: Mule-GHA-PoC/mulesoft-github-actions
          path: framework
      - name: Deploy to CloudHub 2.0
        run: bash framework/scripts/deploy.sh

  release:
    name: Release
    needs: test
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANYPOINT_USERNAME: ${{ secrets.ANYPOINT_USERNAME }}
      ANYPOINT_PASSWORD: ${{ secrets.ANYPOINT_PASSWORD }}
    steps:
      - name: Setup
        uses: Mule-GHA-PoC/mulesoft-github-actions/.github/actions/setup@main
        with:
          fetch-depth: 0

      - name: Prepare and perform release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mvn -B -ntp \
            org.apache.maven.plugins:maven-release-plugin:3.1.1:prepare \
            org.apache.maven.plugins:maven-release-plugin:3.1.1:perform \
            -DtagNameFormat='v@{project.version}' \
            -DlocalCheckout=true \
            -DpreparationGoals='clean verify -DskipTests' \
            -Darguments=-DskipTests

      - name: Merge main back into develop
        run: |
          git fetch origin develop
          git checkout develop
          git merge --no-ff main -m "Merge main into develop after release"
          git push origin develop
