name: Reusable Mule deploy

# Deploys one published Mule application version to CloudHub 2.0.
# It never compiles or repackages: it downloads the immutable Exchange artifact, verifies its
# SHA-256 against the expected value, and runs `mvn mule:deploy` with the static deploy/pom.xml.
#
# Called from reusable-mule-ci.yml (sandbox auto-deploy) and mule-cd.yml (manual promotion).
#
# Inputs
#   environment     GitHub Environment in the calling repository that holds the target
#                   variables/secrets and any approval rules.
#   artifact_id     Mule application artifactId (Exchange asset name).
#   version         Exact published version to deploy. Never a range or "latest".
#   expected_sha256 SHA-256 the downloaded JAR must match.
#
# Required environment variables (see docs/github-configuration.md):
#   ANYPOINT_ORG_ID, ANYPOINT_ENVIRONMENT, ANYPOINT_DEPLOYMENT_TARGET, MULE_RUNTIME_VERSION
#   and the ANYPOINT_USERNAME / ANYPOINT_PASSWORD secrets (org level).

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment name in the calling repository
        required: true
        type: string
      artifact_id:
        description: Mule application artifactId
        required: true
        type: string
      version:
        description: Exact published version to deploy
        required: true
        type: string
      expected_sha256:
        description: Expected SHA-256 of the Exchange JAR
        required: true
        type: string
    secrets:
      ANYPOINT_USERNAME:
        required: false
      ANYPOINT_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.artifact_id }}:${{ inputs.version }} to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: mule-deploy-${{ github.repository }}-${{ inputs.environment }}-${{ inputs.artifact_id }}
      cancel-in-progress: false
    timeout-minutes: 60
    env:
      ANYPOINT_BASE_URI: ${{ vars.ANYPOINT_BASE_URI || 'https://anypoint.mulesoft.com' }}
      ANYPOINT_ORG_ID: ${{ vars.ANYPOINT_ORG_ID }}
      ANYPOINT_BUSINESS_GROUP_ID: ${{ vars.ANYPOINT_BUSINESS_GROUP_ID }}
      ANYPOINT_ENVIRONMENT: ${{ vars.ANYPOINT_ENVIRONMENT }}
      ANYPOINT_DEPLOYMENT_TARGET: ${{ vars.ANYPOINT_DEPLOYMENT_TARGET }}
      MULE_APPLICATION_NAME: ${{ vars.MULE_APPLICATION_NAME || inputs.artifact_id }}
      MULE_RUNTIME_VERSION: ${{ vars.MULE_RUNTIME_VERSION }}
      MULE_RELEASE_CHANNEL: ${{ vars.MULE_RELEASE_CHANNEL || 'EDGE' }}
      MULE_JAVA_VERSION: ${{ vars.MULE_JAVA_VERSION || '17' }}
      MULE_VCORES: ${{ vars.MULE_VCORES || '0.1' }}
      MULE_REPLICAS: ${{ vars.MULE_REPLICAS || '1' }}
      MULE_DEPLOYMENT_TIMEOUT: ${{ vars.MULE_DEPLOYMENT_TIMEOUT || '900' }}
      ANYPOINT_USERNAME: ${{ secrets.ANYPOINT_USERNAME }}
      ANYPOINT_PASSWORD: ${{ secrets.ANYPOINT_PASSWORD }}
      ARTIFACT_ID: ${{ inputs.artifact_id }}
      ARTIFACT_VERSION: ${{ inputs.version }}
      EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
    steps:
      - name: Check out framework scripts
        uses: actions/checkout@v4
        with:
          repository: Mule-GHA-PoC/mulesoft-github-actions
          ref: main
          path: framework
          persist-credentials: false

      - name: Set up Java and Maven
        uses: Mule-GHA-PoC/mulesoft-github-actions/.github/actions/setup-mule-build@main

      - name: Validate deployment configuration
        run: bash framework/scripts/validate-config.sh deploy

      - name: Download published artifact from Exchange and verify SHA-256
        run: |
          mkdir -p framework/deploy/target
          actual=$(bash framework/scripts/exchange.sh download "$ANYPOINT_ORG_ID" "$ARTIFACT_ID" "$ARTIFACT_VERSION" framework/deploy/target)
          if [[ "$actual" != "$EXPECTED_SHA256" ]]; then
            echo "::error::SHA-256 mismatch for ${ARTIFACT_ID}:${ARTIFACT_VERSION}. Expected ${EXPECTED_SHA256}, Exchange returned ${actual}." >&2
            exit 1
          fi
          echo "Exchange artifact matches expected SHA-256 ${actual}"
          bash framework/scripts/verify-artifact.sh \
            "framework/deploy/target/${ARTIFACT_ID}-${ARTIFACT_VERSION}-mule-application.jar" \
            "$ANYPOINT_ORG_ID" "$ARTIFACT_ID" "$ARTIFACT_VERSION"

      - name: Deploy to CloudHub 2.0 without rebuilding
        run: |
          mvn -B -ntp -f framework/deploy/pom.xml \
            -Dapp.group.id="$ANYPOINT_ORG_ID" \
            -Dapp.artifact.id="$ARTIFACT_ID" \
            -Dapp.version="$ARTIFACT_VERSION" \
            mule:deploy

      - name: Verify deployment in Runtime Manager
        run: |
          bash framework/scripts/verify-deployment.sh \
            "$ANYPOINT_ORG_ID" "$ANYPOINT_ENVIRONMENT" "$MULE_APPLICATION_NAME" "$MULE_DEPLOYMENT_TIMEOUT"

      - name: Record deployment metadata
        run: |
          cat > framework/deploy/target/deployment-metadata.json <<EOF
          {
            "artifactId": "${ARTIFACT_ID}",
            "version": "${ARTIFACT_VERSION}",
            "sha256": "${EXPECTED_SHA256}",
            "environment": "${ANYPOINT_ENVIRONMENT}",
            "githubEnvironment": "${{ inputs.environment }}",
            "deploymentTarget": "${ANYPOINT_DEPLOYMENT_TARGET}",
            "applicationName": "${MULE_APPLICATION_NAME}",
            "runtimeVersion": "${MULE_RUNTIME_VERSION}",
            "runId": "${GITHUB_RUN_ID}",
            "runAttempt": "${GITHUB_RUN_ATTEMPT}"
          }
          EOF

      - name: Upload deployment metadata
        uses: actions/upload-artifact@v4
        with:
          name: deployment-${{ inputs.environment }}-${{ inputs.artifact_id }}-${{ inputs.version }}
          path: framework/deploy/target/deployment-metadata.json
          retention-days: 30
          if-no-files-found: error
